    <!-- Theme color for Safari/Chrome top and bottom bars -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
    <style>
      /*
      Sets the background color to match the theme to avoid white bars
      when overscrolling or in safe areas.
    */
      html,
      body {
        background-color: #000000;
        margin: 0;
        padding: 0;
        /* Bloquea la navegacion del historial con swipe desde el borde en iOS PWA.
         Usamos -x y -y explícitos para mayor compatibilidad. */
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
      }
      @media (prefers-color-scheme: light) {
        body {
          background-color: #ffffff;
        }
      }
      /* Splash / Loading screen */
      #corpus-splash {
        position: fixed;
        inset: 0;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #corpus-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .splash-icon {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      .splash-bar-track {
        width: 120px;
        height: 2px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 1px;
        overflow: hidden;
      }
      .splash-bar-fill {
        height: 100%;
        width: 40%;
        background: #7E57C2;
        border-radius: 1px;
        animation: splash-slide 1.5s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.93);
          opacity: 0.75;
        }
      }
      @keyframes splash-slide {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(150%);
        }
        100% {
          transform: translateX(150%);
        }
      }
    </style>

  <body>

    <!-- Splash screen: visible while Flutter engine loads, fades out automatically -->
    <div id="corpus-splash" aria-hidden="true">
      <div class="splash-logo-wrap">
        <img class="splash-icon" src="icons/Icon-192.png" alt="Corpus Logo">
        <div class="splash-bar-track">
          <div class="splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <script>
      // Hide the splash as soon as Flutter has painted its first frame
      window.addEventListener('flutter-first-frame', function() {
        var splash = document.getElementById('corpus-splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function() {
            splash.remove();
          }, 600);
        }
      });
    </script>
