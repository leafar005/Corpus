    <style>
      :root {
        color-scheme: dark light;
      }
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        background-color: #000000;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      @media (prefers-color-scheme: light) {
        html, body { background-color: #F5F5F5; }
      }
      #corpus-safe-area-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
      }

      /* ─── Splash / Loading screen ──────────────────────────────────────
         Diseñado para ser visualmente idéntico a los apple-touch-startup-image:
         ▸ Fondo negro
         ▸ Logo centrado, mismo tamaño relativo que el PNG de iOS:
           el mando ocupa ~35% del ancho → min(35vw, 180px)
         ▸ Sin animación de pulso/escala — el PNG de iOS es estático,
           el HTML también, para que la transición sea seamless
         ▸ El splash se oculta cuando Dart dispara el evento 'corpus-ready'
           (no en flutter-first-frame, que llega demasiado pronto)
      ──────────────────────────────────────────────────────────────────── */
      #corpus-splash {
        position: fixed;
        inset: 0;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #corpus-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .splash-icon {
        /* Mismo tamaño visual que los PNG de iOS splash */
        width: min(35vw, 180px);
        height: auto;
        max-height: min(35vw, 180px);
        object-fit: contain;
        /* Sin animación — idéntico al PNG estático de iOS */
      }
      .splash-bar-track {
        margin-top: 24px;
        width: min(35vw, 180px);
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 1px;
        overflow: hidden;
      }
      .splash-bar-fill {
        height: 100%;
        width: 40%;
        background: #7E57C2;
        border-radius: 1px;
        animation: splash-slide 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splash-slide {
        0%   { transform: translateX(-250%); }
        60%  { transform: translateX(350%); }
        100% { transform: translateX(350%); }
      }
    </style>

    <script>
      (function() {
        var lastTheme = null;
        function applyBodyBg() {
          if (lastTheme && document.body) {
            document.body.style.backgroundColor = lastTheme.bgHex;
          }
        }
        window.__corpusSyncTheme = function(bgHex, isDark) {
          lastTheme = { bgHex: bgHex, isDark: !!isDark };
          document.documentElement.style.backgroundColor = bgHex;
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          applyBodyBg();

          var metas = document.head.querySelectorAll('meta[name="theme-color"]');
          if (metas.length > 0) {
            metas[0].removeAttribute('media');
            metas[0].setAttribute('content', bgHex);
            for (var i = 1; i < metas.length; i++) {
              metas[i].remove();
            }
          } else {
            var meta = document.createElement('meta');
            meta.setAttribute('name', 'theme-color');
            meta.setAttribute('content', bgHex);
            document.head.appendChild(meta);
          }

          try {
            window.localStorage.setItem('corpus_web_theme_bg', bgHex);
            window.localStorage.setItem('corpus_web_theme_dark', isDark ? '1' : '0');
          } catch (_) {}
        };

        try {
          var savedBg = window.localStorage.getItem('corpus_web_theme_bg');
          var savedDark = window.localStorage.getItem('corpus_web_theme_dark');
          if (savedBg) {
            window.__corpusSyncTheme(savedBg, savedDark === '1');
          }
        } catch (_) {}

        document.addEventListener('DOMContentLoaded', applyBodyBg, { once: true });

        function ensureViewportFitCover(meta) {
          if (!meta || meta.nodeType !== 1 || meta.getAttribute('name') !== 'viewport') return;
          var content = meta.getAttribute('content') || '';
          if (!/viewport-fit\s*=\s*cover/i.test(content)) {
            var next = content
              ? content + ', viewport-fit=cover'
              : 'width=device-width, initial-scale=1.0, viewport-fit=cover';
            meta.setAttribute('content', next);
            window.requestAnimationFrame(function() {
              window.dispatchEvent(new Event('resize'));
            });
          }
        }

        ensureViewportFitCover(document.head.querySelector('meta[name="viewport"]'));
        if (window.MutationObserver) {
          var observer = new MutationObserver(function(mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var m = mutations[i];
              if (m.type === 'attributes') {
                ensureViewportFitCover(m.target);
              } else if (m.addedNodes) {
                for (var j = 0; j < m.addedNodes.length; j++) {
                  ensureViewportFitCover(m.addedNodes[j]);
                }
              }
            }
          });
          observer.observe(document.head, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['content']
          });
        }

        window.__corpusGetSafeAreaInsets = function() {
          var probe = document.getElementById('corpus-safe-area-probe');
          if (!probe || !window.getComputedStyle) return [0, 0, 0, 0];
          var s = window.getComputedStyle(probe);
          return [
            parseFloat(s.paddingTop) || 0,
            parseFloat(s.paddingRight) || 0,
            parseFloat(s.paddingBottom) || 0,
            parseFloat(s.paddingLeft) || 0
          ];
        };
      })();
    </script>

  <body>
    <div id="corpus-safe-area-probe" aria-hidden="true"></div>

    <!-- Splash screen: visible mientras carga Flutter.
         Se oculta cuando Dart dispara el evento 'corpus-ready' (no en
         flutter-first-frame, que es demasiado temprano — el primer frame
         aún muestra el estado de carga de la app).
         Fallback de seguridad a los 8s por si algo falla. -->
    <div id="corpus-splash" aria-hidden="true">
      <div class="splash-logo-wrap">
        <img class="splash-icon" src="splash_logo.png" alt="Corpus Logo">
        <div class="splash-bar-track">
          <div class="splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <script>
      var _cropperPromise = null;
      window.__loadCropperJs = function() {
        if (window.Cropper) return Promise.resolve(true);
        if (_cropperPromise) return _cropperPromise;
        _cropperPromise = new Promise(function(resolve) {
          if (!document.getElementById('corpus-cropper-css')) {
            var link = document.createElement('link');
            link.id = 'corpus-cropper-css';
            link.rel = 'stylesheet';
            link.href = 'https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.css';
            link.integrity = 'sha384-msRo/DUqciLiajfTHR4aynPm/OyeCwjTio3llAz/9Ajeq4fDBmSiNL1QDum77PDK';
            link.crossOrigin = 'anonymous';
            document.head.appendChild(link);
          }
          var existingScript = document.getElementById('corpus-cropper-js');
          if (existingScript) {
            if (window.Cropper) {
              resolve(true);
              return;
            }
            existingScript.addEventListener('load', function() { resolve(true); }, { once: true });
            existingScript.addEventListener('error', function() { _cropperPromise = null; resolve(false); }, { once: true });
            return;
          }
          var script = document.createElement('script');
          script.id = 'corpus-cropper-js';
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.js';
          script.integrity = 'sha384-qcjDNZ/IpdqIwoKebwA5UvG4QQo4TWNqKmSI+lmUioJaSOR558QFRETuu+WA1btW';
          script.crossOrigin = 'anonymous';
          script.async = true;
          script.onload = function() { resolve(true); };
          script.onerror = function() { _cropperPromise = null; resolve(false); };
          document.head.appendChild(script);
        });
        return _cropperPromise;
      };

      var _splashHidden = false;
      function hideSplash() {
        if (_splashHidden) return;
        _splashHidden = true;
        var splash = document.getElementById('corpus-splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function() { splash.remove(); }, 500);
        }
      }
      window.addEventListener('corpus-ready', hideSplash);
      setTimeout(hideSplash, 8000);
    </script>
