      html, body {
        background-color: #000000;
        margin: 0;
        padding: 0;
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
      }
      @media (prefers-color-scheme: light) {
        body { background-color: #ffffff; }
      }

      /* ─── Splash / Loading screen ──────────────────────────────────────
         Diseñado para ser visualmente idéntico a los apple-touch-startup-image:
         ▸ Fondo negro
         ▸ Logo centrado, mismo tamaño relativo que el PNG de iOS:
           el mando ocupa ~35% del ancho → min(35vw, 180px)
         ▸ Sin animación de pulso/escala — el PNG de iOS es estático,
           el HTML también, para que la transición sea seamless
         ▸ El splash se oculta cuando Dart dispara el evento 'corpus-ready'
           (no en flutter-first-frame, que llega demasiado pronto)
      ──────────────────────────────────────────────────────────────────── */
      #corpus-splash {
        position: fixed;
        inset: 0;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #corpus-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .splash-icon {
        /* Mismo tamaño visual que los PNG de iOS splash */
        width: min(35vw, 180px);
        height: auto;
        max-height: min(35vw, 180px);
        object-fit: contain;
        /* Sin animación — idéntico al PNG estático de iOS */
      }
      .splash-bar-track {
        margin-top: 24px;
        width: min(35vw, 180px);
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 1px;
        overflow: hidden;
      }
      .splash-bar-fill {
        height: 100%;
        width: 40%;
        background: #7E57C2;
        border-radius: 1px;
        animation: splash-slide 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splash-slide {
        0%   { transform: translateX(-250%); }
        60%  { transform: translateX(350%); }
        100% { transform: translateX(350%); }
      }
    </style>

  <body>

    <!-- Splash screen: visible mientras carga Flutter.
         Se oculta cuando Dart dispara el evento 'corpus-ready' (no en
         flutter-first-frame, que es demasiado temprano — el primer frame
         aún muestra el estado de carga de la app).
         Fallback de seguridad a los 8s por si algo falla. -->
    <div id="corpus-splash" aria-hidden="true">
      <div class="splash-logo-wrap">
        <img class="splash-icon" src="splash_logo.png" alt="Corpus Logo">
        <div class="splash-bar-track">
          <div class="splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <script>
      var _splashHidden = false;
      function hideSplash() {
        if (_splashHidden) return;
        _splashHidden = true;
        var splash = document.getElementById('corpus-splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function() { splash.remove(); }, 500);
        }
      }
      window.addEventListener('corpus-ready', hideSplash);
      setTimeout(hideSplash, 8000);
    </script>
